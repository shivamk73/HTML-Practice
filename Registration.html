<title>Registration Form</title>

<body style="background-color: lightgreen;">

<center>
<img src="https://yt3.googleusercontent.com/55IMpTfTU1fezTDZb7ZbJ30ghHwuWEzi_JLwfyvReWSi0HWEF_LkGyCizUv9xV6XZ0Tnh4xd=s900-c-k-c0x00ffffff-no-rj" height="120px" weight="180px">

<h2>REGISTRATION FORM</h2>
<hr color="darkblue">
<form style="background-color: antiquewhite; width: 350px; padding: 20px;">

    <label>First Name</label>
    <input type="text">
    <br><br>

    <label>Last Name</label>
    <input type="text">
    <br><br>

    <label>Email</label>
    <input type="email">
    <br><br>

    <label>Mobile No.</label>
    <input type="number">
    <br><br>

    <label>Gender</label>
    <br>

    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other

    <br><br>

    <label>Recent Education</label>
    <input type="text">
    <br><br>

    <label>Select Course</label>

    <select>
        <option>B.Tech</option>
        <option>M.Tech</option>
        <option>BBA</option>
        <option>MBA</option>
    </select>

    <br><br>

    <button>Submit</button>

</form>

</centre>
</body>
</html>
